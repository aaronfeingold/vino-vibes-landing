<!-- @dsCard group="Direction B · chat-first (not live)" height=330 subtitle="kind: your_bottles · Organize" -->
<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;background:var(--background)}
.list{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius-lg);background:var(--surface-raised)}
.sw{display:flex}.sw span{width:18px;height:26px;border-radius:4px}.sw span+span{margin-left:-6px}
</style></head>
<body>
<div class="vv" style="padding:24px">
  <section class="vv-block">
    <div class="vv-block__head"><div class="vv-eyebrow">Your bottles</div></div>
    <div style="margin-top:12px;display:flex;flex-direction:column;gap:8px">
      <div class="list"><span class="sw" aria-hidden="true"><span style="background:var(--wine-red)"></span><span style="background:var(--wine-red)"></span><span style="background:var(--wine-white)"></span></span><span style="flex:1;font-size:15px;font-weight:700">Loved</span><span class="vv-muted" style="font-size:13px">7 bottles</span></div>
      <div class="list"><span class="sw" aria-hidden="true"><span style="background:var(--wine-red)"></span><span style="background:var(--wine-orange)"></span><span style="background:var(--wine-sparkling)"></span></span><span style="flex:1;font-size:15px;font-weight:700">Want to try</span><span class="vv-muted" style="font-size:13px">4 bottles</span></div>
      <div class="list" style="box-shadow:0 0 0 1px color-mix(in srgb, var(--primary) 50%, transparent)"><span class="sw" aria-hidden="true"><span style="background:var(--wine-red)"></span><span style="background:var(--wine-red)"></span><span style="background:var(--wine-red)"></span></span><span style="flex:1"><span style="display:block;font-size:15px;font-weight:700">Steak nights</span><span style="display:block;font-size:12px;color:var(--highlight)">Barolo 2016 just added</span></span><span class="vv-muted" style="font-size:13px">3 bottles</span></div>
    </div>
    <div class="vv-block__actions" style="margin-top:12px">
      <button class="vv-btn vv-btn--outline" type="button">New list</button>
      <button class="vv-btn vv-btn--outline" type="button">Places I've been</button>
    </div>
  </section>
</div>
</body></html>
