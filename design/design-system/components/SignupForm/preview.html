<!doctype html>
<html lang="en"><head><meta charset="utf-8"><style>body{margin:0;background:var(--vv-page)} .cap{font-size:12px;color:var(--vv-text3);letter-spacing:.04em;margin-bottom:8px}</style></head>
<body class="vv">
<div style="padding:24px;max-width:520px;display:flex;flex-direction:column;gap:24px">
  <div>
    <div class="cap">READY</div>
    <div style="display:flex;flex-wrap:wrap;gap:10px"><label for="e1" class="vv-sr">Email address</label><input id="e1" class="vv-input" type="email" placeholder="you@email.com" style="flex:1 1 240px"><button class="vv-b vv-b--primary" type="button">Get early access</button></div>
    <div class="vv-note" style="margin-top:12px">We'll email you when your invite is ready.</div>
  </div>
  <div>
    <div class="cap">ERROR</div>
    <div style="display:flex;flex-wrap:wrap;gap:10px"><label for="e2" class="vv-sr">Email address</label><input id="e2" class="vv-input" type="email" value="aarie@" aria-invalid="true" style="flex:1 1 240px;border-color:var(--vv-stroke)"><button class="vv-b vv-b--primary" type="button">Get early access</button></div>
    <p class="vv-error" role="alert" style="margin-top:8px">Please enter a valid email address</p>
  </div>
  <div>
    <div class="cap">DONE</div>
    <div class="vv-success" role="status" style="padding:16px 18px;font-size:16px;font-weight:600">You're on the list. We will email you when your invite is ready.</div>
  </div>
</div>
</body></html>
